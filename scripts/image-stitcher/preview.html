<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>街景拼接工作台</title><link rel="stylesheet" href="editor.css"></head><body>
<header><h1>街景拼接工作台</h1><button id="importImages">＋ 图片</button><button id="addText">T 文字</button><button id="undo" title="⌘ / Ctrl Z">撤销</button><button id="redo" title="⌘ / Ctrl Shift Z">重做</button><div class="spacer"></div><span id="saveState">正在载入</span><button id="openProject">打开工程</button><button id="saveProject">保存工程</button><button class="primary" id="exportPng">导出 PNG</button></header>
<div class="app"><aside class="left"><div class="section-title">图层 <span id="layerCount" class="small"></span></div><div id="layers"></div><div class="layer-tools"><button id="raise">上移一层</button><button id="lower">下移一层</button><button id="duplicate">复制图层</button><button id="delete">删除图层</button></div><div class="divider"></div><div class="section-title">画布 <span class="small">像素</span></div><div class="row"><label class="field"><span>宽度</span><input id="canvasWidth" type="number" min="64" max="8192" value="2688"></label><label class="field"><span>高度</span><input id="canvasHeight" type="number" min="64" max="8192" value="1536"></label></div><button id="resizeCanvas" class="full">应用画布尺寸</button><div class="divider"></div><button id="newProject" class="full">新建空白工程</button><p class="readme">拖入图片即可添加。编辑不改原图。工程文件包含图片和调整参数，可稍后继续。</p><p class="readme">空格拖动画布 · 滚轮缩放<br>方向键微移，Shift 加速<br>⌘ / Ctrl Z 撤销</p></aside>
<section class="work"><div class="viewbar"><button id="fit">适合窗口</button><button id="zoomOut" aria-label="缩小">−</button><span id="zoomLabel" class="small">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="actual">100%</button><div class="spacer"></div><label><input id="showOutline" type="checkbox" checked>选框</label></div><div id="workspace"><canvas id="view" tabindex="0" aria-label="拼接画布，拖动选中图层，右下角手柄缩放"></canvas><div class="hint">拖动图层移动 · 右下角手柄缩放 · 空格拖动画布</div><div id="loading" class="loading">正在恢复本机工程…</div></div></section>
<aside class="right"><div id="empty">选择一个图层开始调整</div><div id="inspector" class="hidden"><input id="layerName" aria-label="图层名称" maxlength="200"><div class="row"><label class="field"><span>X 位置</span><input data-prop="x" type="number" step="1"></label><label class="field"><span>Y 位置</span><input data-prop="y" type="number" step="1"></label><label class="field"><span>缩放 %</span><input data-prop="scale" type="number" min="2" max="2000" step="1"></label><label class="field"><span>旋转 °</span><input data-prop="rotation" type="number" min="-360" max="360" step=".1"></label></div><label class="field"><span>混合模式</span><select id="blend" class="full"><option value="source-over">正常</option><option value="multiply">正片叠底</option><option value="screen">滤色</option><option value="overlay">叠加</option><option value="difference">差值（检查错位）</option></select></label><div id="opacityControl"></div><div class="divider"></div><div id="imageControls"><div class="section-title">调色 <button id="resetColor">重置</button></div><div id="colorControls"></div><div class="divider"></div><div class="section-title">边缘羽化 <span class="small">图层尺寸 %</span></div><div id="featherControls"></div></div><div id="textControls" class="hidden"><label class="field"><span>文字内容</span><textarea id="textContent" rows="3" maxlength="2000"></textarea></label><div class="row"><label class="field"><span>字号</span><input id="fontSize" type="number" min="8" max="300"></label><label class="field"><span>文字颜色</span><input id="textColor" type="color"></label></div><label class="field"><span>字体</span><select id="fontFamily" class="full"><option value="sans-serif">黑体</option><option value="serif">宋体</option><option value="monospace">等宽</option></select></label></div></div></aside></div>
<footer><span id="status" role="status" aria-live="polite">就绪</span><span id="dimensions">2688 × 1536 px</span><span>本地编辑</span></footer><div id="toast" role="status" class="hidden"></div><input id="imageFiles" class="hidden" type="file" accept="image/png,image/jpeg,image/webp" multiple><input id="projectFile" class="hidden" type="file" accept="application/json,.json"><script type="module" src="editor.mjs"></script></body></html>
