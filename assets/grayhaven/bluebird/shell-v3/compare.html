<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bluebird · 覆色对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#24282b;color:#e7ddc8;font:16px/1.65 system-ui}main{max-width:1300px;margin:auto;padding:28px}h1{font:34px Georgia,serif}h2{font-size:22px;margin-top:36px}a{color:#d9ae70}p{color:#bec6bd}.compare{position:relative;aspect-ratio:1500/1150;background:#787d75}.compare img{position:absolute;width:100%;height:100%;object-fit:contain}.compare #after{clip-path:inset(0 50% 0 0)}.tag{position:absolute;top:12px;padding:5px 12px;background:#24282be0;font-size:14px}.left{left:12px}.right{right:12px}input[type=range]{width:100%;min-height:44px;accent-color:#d9ae70}label{display:block;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.grid img{width:100%}figure{margin:0}figcaption{font-size:14px;color:#bec6bd;margin:8px 0}.pair{display:flex;gap:20px;flex-wrap:wrap}.pair img{width:320px;max-width:100%;filter:grayscale(1)}select{font:inherit;padding:10px;min-height:44px;background:#e7ddc8;color:#24282b;border:0}details{margin:30px 0}summary{cursor:pointer;min-height:44px}details img{max-width:100%}@media(max-width:700px){main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:28px}}</style>
<main><a href="index.html">← 旋转三维模型 / 比较三个版本</a><h1>Bluebird · 局部叠加对照</h1><p>以下为实际 Blender 模型渲染。两版使用相同相机、光照、曝光和几何；拖动分界线比较基础贴图与局部叠加。</p>
<div class="compare"><img src="../shell-v1/previews/01-textured-exterior.png" alt="原版基础贴图实际渲染"><img id="after" src="previews/01-textured-exterior.png" alt="新版局部叠加实际渲染"><span class="tag left">新版 · 局部叠加</span><span class="tag right">原版 · 基础贴图</span></div><label for="split">新版显示比例<input id="split" type="range" min="0" max="100" value="50"></label>
<h2>三个独立绘制层</h2><p>下面是复用的颜料与笔触源图；实际覆盖还受建筑专属的局部选区约束。源图有颜色的地方，并不意味着整面建筑都会覆色。大部分表面继续使用原贴图。</p>
<label for="atlas">查看区域 <select id="atlas"><option value="ground">一楼外墙</option><option value="upper">二楼外墙</option><option value="roof">屋顶与雨棚</option></select></label>
<div class="grid"><figure><img id="repaint" src="layers/ground-repaint.png" alt="整体补漆与大色块源图"><figcaption>01 · 大色块 / Repaint</figcaption></figure><figure><img id="weather" src="layers/ground-weather.png" alt="气候磨损覆盖蒙版"><figcaption>02 · 气候磨损 / Weather</figcaption></figure><figure><img id="brush" src="layers/ground-brush.png" alt="表现性干笔覆盖蒙版"><figcaption>03 · 粗笔触 / Brush</figcaption></figure></div>
<h2>光色与剖视检查</h2><div class="grid"><figure><img src="previews/08-cool-light.png" alt="冷光"><figcaption>冷光：仅改变主光颜色</figcaption></figure><figure><img src="previews/09-warm-light.png" alt="暖光"><figcaption>暖光：相同纹理与曝光</figcaption></figure><figure><img src="previews/02-ground-cutaway.png" alt="一楼剖视"><figcaption>剖视：室内原有材质与明暗关系</figcaption></figure></div>
<h2>320 px 灰度检查</h2><div class="pair"><figure><img src="../shell-v1/previews/01-textured-exterior.png" alt="原版缩小灰度"><figcaption>原版</figcaption></figure><figure><img src="previews/10-grayscale-320.png" alt="新版 320 像素灰度渲染"><figcaption>新版</figcaption></figure></div>
<p><a href="bluebird_shell_layered.blend" download>分层 Blender</a> · <a href="bluebird_shell_textured.glb" download>烘焙 GLB</a> · <a href="README.md">制作说明</a></p></main>
<script>document.querySelector('#split').oninput=e=>document.querySelector('#after').style.clipPath=`inset(0 ${100-e.target.value}% 0 0)`;document.querySelector('#atlas').onchange=e=>{for(const id of ['repaint','weather','brush'])document.getElementById(id).src=`layers/${e.target.value}-${id}.png`}</script></html>
