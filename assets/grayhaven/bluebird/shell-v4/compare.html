<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bluebird · 外部构造对照</title><style>*{box-sizing:border-box}body{margin:0;background:#24282b;color:#e7ddc8;font:16px/1.65 system-ui}main{max-width:1300px;margin:auto;padding:28px}h1{font:32px Georgia,serif}h2{font-size:22px;margin-top:36px}a{color:#d9ae70}p{color:#bec6bd}.compare{position:relative;aspect-ratio:1500/1150;background:#787d75}.compare img{position:absolute;width:100%;height:100%;object-fit:contain}.compare #after{clip-path:inset(0 50% 0 0)}.tag{position:absolute;top:12px;padding:5px 12px;background:#24282be8;font-size:14px}.left{left:12px}.right{right:12px}input{width:100%;min-height:44px;accent-color:#d9ae70}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0}img{max-width:100%}figcaption{font-size:14px;color:#bec6bd}label{display:block;margin:14px 0}@media(max-width:700px){main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:26px}}</style></head><body><main>
<a href="index.html">← 返回三维预览</a><h1>蓝鸟餐厅 · 外部构造细化</h1><p>实际模型渲染，使用同一外观机位与光照。拖动滑块，比较新增构件与原建筑。</p>
<div class="compare"><img src="../shell-v3/previews/01-textured-exterior.png" alt="细化前的局部油画建筑"><img id="after" src="previews/01-exterior.png" alt="增加门头、竖牌、排水与屋面细节的建筑"><span class="tag left">外部细化</span><span class="tag right">细化前</span></div><label for="split">细化后显示比例<input id="split" type="range" min="0" max="100" value="50"></label>
<h2>入口与屋面</h2><div class="grid"><figure><img src="previews/03-entry-detail.png" alt="木框招牌、漆字、竖牌、门灯和门扇近景"><figcaption>门头：独立板框、背撑与平面漆字；入口：门套、门扇、压条和五金。</figcaption></figure><figure><img src="previews/04-roof-detail.png" alt="屋顶排水管、檐沟和排气管近景"><figcaption>屋面：开口檐沟、管箍、弯头、泛水基座及帽盖。</figcaption></figure></div>
<h2>街道与立面</h2><figure><img src="previews/02-street.png" alt="较低观察角度的餐厅"><figcaption>街角入口保持明确，二楼继续退向后左侧。</figcaption></figure><div class="grid"><figure><img src="previews/05-front.png" alt="正立面"><figcaption>正面</figcaption></figure><figure><img src="previews/06-right.png" alt="右立面"><figcaption>右侧</figcaption></figure></div>
<h2>剖视</h2><div class="grid"><figure><img src="previews/08-ground-cutaway.png" alt="一楼剖视"><figcaption>一楼：前侧门头、门扇和上墙同时让位。</figcaption></figure><figure><img src="previews/09-upper-cutaway.png" alt="二楼剖视"><figcaption>二楼：保留原楼梯、楼板洞口及护栏。</figcaption></figure></div><p>几何承担厚度、连接和轮廓；原油画贴图承担木纹、磨损与色块；光照承担投影和体积；网页控件只负责版本与观察视角切换。</p><a href="README.md">制作说明</a></main><script>document.getElementById('split').oninput=e=>document.getElementById('after').style.clipPath=`inset(0 ${100-e.target.value}% 0 0)`</script></body></html>
