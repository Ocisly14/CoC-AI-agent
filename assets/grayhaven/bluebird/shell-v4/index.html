<aside><div class="eyebrow">BLUEBIRD / EXTERIOR 04</div><h1>蓝鸟餐厅<br>外部构造细化</h1><p class="intro">木框门头、竖牌、排水管、雨棚与门窗细部。切换版本，比较同一视角下的变化。</p>
<label for="version">模型版本<select id="version"><option value="v4">新版 · 外部构造细化</option><option value="v3">细化前 · 局部油画</option><option value="v1">原版 · 基础贴图</option><option value="v2">上版 · 整面覆色</option></select></label><label for="light">光色检查<select id="light"><option value="neutral">中性日光</option><option value="cool">冷光</option><option value="warm">暖光</option></select></label><label for="view">观察视图<select id="view"><option value="exterior">完整外观</option><option value="street">街道视角</option><option value="entry">门头与入口近景</option><option value="roof">屋檐与管线近景</option><option value="ground">一楼剖视</option><option value="upper">二楼剖视与楼梯洞口</option><option value="plan">一楼俯视</option><option value="front">正面</option><option value="right">右侧</option><option value="rear">背面</option></select></label>
<label class="check"><input id="white" type="checkbox">白模检查</label><label class="check"><input id="glass" type="checkbox" checked>显示玻璃</label><button id="reset">恢复该视图</button><p class="hint">左键旋转 · 右键平移 · 滚轮缩放<br>白模模式隐藏玻璃，方便检查真实开口。</p>
<div class="links"><a href="compare.html">外观前后对比与细节图</a><a href="previews/03-entry-detail.png" target="_blank">入口近景渲染</a><a href="previews/08-ground-cutaway.png" target="_blank">一楼剖视渲染</a><a href="bluebird_exterior_detailed.blend" download>下载 Blender 模型</a><a href="bluebird_exterior_detailed.glb" download>下载完整 GLB</a><a href="README.md">制作说明</a></div><details><summary>本轮范围</summary><p>沿用原有建筑主体与局部油画材质。新增固定门头、双面竖牌、门扇、门灯、檐沟、落水管、窗台和屋顶通风管；本轮没有添加室内陈设。</p><p>剖视是资产检查功能。游戏运行时的拾取、遮光壳及场景尺度尚未接入。</p></details></aside>
<main id="stage"><div id="status" role="status">正在载入建筑 GLB…</div></main>
<script type="module">
import * as THREE from 'three';
import {readPacked} from './packed-assets.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const container=document.querySelector('#stage'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.LinearToneMapping;renderer.toneMappingExposure=1;container.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#787d75');
scene.add(new THREE.HemisphereLight(0xcbd7dc,0x817969,1.65));
const sun=new THREE.DirectionalLight(0xffefda,2.2);sun.position.set(-3,18,9);sun.target.position.set(6,0,-5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-16,right:16,bottom:-16,top:16,near:1,far:50});sun.shadow.normalBias=.025;sun.shadow.bias=-.00005;scene.add(sun,sun.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:'#787d75',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(6,-.21,-5);ground.receiveShadow=true;scene.add(ground);
const camera=new THREE.OrthographicCamera(-10,10,8,-8,.05,150);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minZoom=.4;controls.maxZoom=5;
const views={street:{pos:[21,10.7,22],target:[6,2.6,-3.5],h:15.5},entry:{pos:[17,5.3,8],target:[10.38,2.45,-.65],h:6},roof:{pos:[19,14,9],target:[8.5,3.5,-4.4],h:9.8},exterior:{pos:[21,15,17],target:[5.8,2,-4.8],h:15.5},ground:{pos:[18,20,14],target:[6,1,-5],h:14.7},upper:{pos:[13,15,7],target:[3,3.8,-7],h:10.5},plan:{pos:[6,25,-4.999],target:[6,0,-5],h:12},front:{pos:[6,3,25],target:[6,3,0],h:9.5},right:{pos:[30,3,-5],target:[12,3,-5],h:9.5},rear:{pos:[6,3,-30],target:[6,3,-10],h:9.5}};
let assets={},asset,detailRoot,version='v4',mode='exterior',triangles=0,meshCount=0;
const clay=new THREE.MeshStandardMaterial({color:'#cfcbc0',roughness:.86});
function resize(){const w=container.clientWidth,h=container.clientHeight,a=w/h;const span=Math.max(views[mode].h,mode==='entry'?7.5/a:mode==='roof'?12/a:mode==='street'?19/a:mode==='exterior'?18/a:mode==='ground'?18/a:mode==='plan'?14/a:mode==='upper'?9/a:13/a);camera.left=-span*a/2;camera.right=span*a/2;camera.top=span/2;camera.bottom=-span/2;camera.updateProjectionMatrix();renderer.setSize(w,h)}
function visibility(){
 if(!asset)return;
 const white=document.querySelector('#white').checked,showGlass=document.querySelector('#glass').checked;
 triangles=0;meshCount=0;
 for(const root of [asset,...(detailRoot?[detailRoot]:[])]){
  if(root===detailRoot)root.visible=version==='v4';
  root.traverse(o=>{
   const d=o.userData;
   if(d.architecture){let hide=false;
    if(mode==='ground'||mode==='plan')hide=d.floor===1||['roof','roof_edge'].includes(d.role)||(['front','right','corner'].includes(d.side)&&d.band==='high');
    if(mode==='upper')hide=(d.floor===0&&d.role!=='stair')||['roof','roof_edge'].includes(d.role)||(['front','right','corner'].includes(d.side)&&(['wall','frame','glass'].includes(d.role)||d.exteriorDetail));
    if(d.role==='glass'&&(white||!showGlass))hide=true;
    o.visible=!hide;
   }
   if(o.isMesh){o.material=white?clay:o.userData.originalMaterial;if(root!==detailRoot||version==='v4'){triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;meshCount++;}}
  });
 }
 status.textContent=({v4:'外部细化',v3:'细化前',v2:'整面覆色',v1:'基础贴图'}[version])+' · '+(white?'白模':'油画材质')+' · '+Math.round(triangles).toLocaleString()+' 三角形';
 window.bluebirdShellQA={loaded:true,version,meshCount,triangles,architectureOnly:true,versions:4};
}
function setView(){mode=document.querySelector('#view').value;const v=views[mode];camera.position.fromArray(v.pos);controls.target.fromArray(v.target);camera.up.set(0,1,0);camera.zoom=1;controls.update();resize();visibility();}
new ResizeObserver(resize).observe(container);
const HOSTED=false;
const loader=new GLTFLoader(),pending={};
const modelURLs={v3:'../shell-v3/bluebird_shell_textured.glb',v1:'../shell-v1/bluebird_shell_textured.glb',v2:'../shell-v2/bluebird_shell_textured.glb',details:'./bluebird_exterior_details.glb'};
async function loadModel(key){
 if(key==='details'&&detailRoot)return detailRoot;
 if(assets[key])return assets[key];
 if(pending[key])return pending[key];
 pending[key]=(async()=>{
  let gltf;
  if(HOSTED&&key!=='details'){
   const {bytes}=await readPacked(modelURLs[key],(done,total)=>{status.textContent='正在载入建筑 '+Math.round(done/total*100)+'%';});
   gltf=await loader.parseAsync(bytes.buffer,'');
  }else gltf=await loader.loadAsync(modelURLs[key]);
  const root=gltf.scene;root.visible=false;scene.add(root);
  root.traverse(o=>{if(o.isMesh){o.castShadow=o.material.name!=='glass'&&!o.userData.lettering;o.receiveShadow=true;o.userData.originalMaterial=o.material;}});
  if(key==='details')detailRoot=root;else assets[key]=root;
  return root;
 })();
 try{return await pending[key];}finally{delete pending[key];}
}
async function chooseVersion(){
 version=document.querySelector('#version').value;const chosen=version;
 try{
  status.textContent='正在载入模型…';
  const [root]=await Promise.all([loadModel(chosen==='v4'?'v3':chosen),...(chosen==='v4'?[loadModel('details')]:[])]);
  if(chosen!==version)return;
  Object.values(assets).forEach(a=>a.visible=false);asset=root;asset.visible=true;visibility();
 }catch(e){if(chosen===version)status.textContent='载入失败，请重新选择版本重试，或查看静态渲染。';}
}
document.querySelector('#version').onchange=chooseVersion;
chooseVersion();
document.querySelector('#light').onchange=()=>{sun.color.set({neutral:0xffefda,cool:0xa6c7ff,warm:0xffb36e}[document.querySelector('#light').value]);};
document.querySelector('#view').addEventListener('change',setView);document.querySelector('#reset').onclick=setView;document.querySelector('#white').onchange=visibility;document.querySelector('#glass').onchange=visibility;
setView();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
